    let current = 0;
    let score = 0;
    let finished = false;
    let shuffledQuestions = [...questions];

function shuffleQuestions() {
  shuffledQuestions = [...questions]
    .sort(() => Math.random() - 0.5)
    .slice(0, 10);
}

    const el = id => document.getElementById(id);

    function showQuestion() {
const q = shuffledQuestions[current];
      el("count").textContent =
`第${current + 1}問 / 全${shuffledQuestions.length}問`;
      el("score").textContent = `正解 ${score}問`;
      el("bar").style.width =
`${current / shuffledQuestions.length * 100}%`;

      el("a").innerHTML = `<span class="symbol">🅰️</span>${q.a}`;
      el("b").innerHTML = `<span class="symbol">🅱️</span>${q.b}`;

      el("a").disabled = false;
      el("b").disabled = false;
      el("a").style.borderColor = "";
      el("b").style.borderColor = "";
      el("result").style.display = "none";
      el("next").style.display = "none";
    }

    function answer(selected) {
      if (el("a").disabled || finished) return;

      const q = questions[current];
      const correct = selected === q.correct;

      if (correct) score++;

      el("a").disabled = true;
      el("b").disabled = true;

      el(q.correct).style.borderColor = "#28a66a";
      if (!correct) {
        el(selected).style.borderColor = "#e05c65";
      }

      el("score").textContent = `正解 ${score}問`;
      el("bar").style.width =
`${(current + 1) / shuffledQuestions.length * 100}%`;

      el("result").innerHTML = `
        <h2>${correct ? "🎉 正解！" : "💡 残念！"}</h2>
        <strong>正解：</strong>${q[q.correct]}<br>
        ${q.explanation}
      `;
      el("result").style.display = "block";

      el("next").textContent =
current === shuffledQuestions.length - 1 ? "結果を見る →" : "次の問題へ →";
      el("next").style.display = "inline-block";
    }

    function nextQuestion() {
if (current < shuffledQuestions.length - 1) {
        current++;
        showQuestion();
      } else {
        showFinalResult();
      }
    }

    function showFinalResult() {
      finished = true;
      el("count").textContent = "ゲーム終了！";
      el("bar").style.width = "100%";
      el("a").style.display = "none";
      el("b").style.display = "none";
      el("result").innerHTML = `
        <h2>🏆 あなたの結果</h2>
        <p style="font-size:28px;font-weight:bold;text-align:center">
          ${questions.length}問中 ${score}問正解！
        </p>
        <p style="text-align:center">
          ${score === questions.length ? "全問正解！すごい！" :
            score >= 7 ? "素晴らしい成績！" :
            score >= 4 ? "なかなかの推理力！" :
            "次はもっと正解を目指そう！"}
        </p>
      `;
      el("result").style.display = "block";
      el("next").textContent = "もう一度遊ぶ ↻";
      el("next").onclick = restart;
    }

    function restart() {
      current = 0;
      score = 0;
      finished = false;
      shuffleQuestions();
      el("a").style.display = "";
      el("b").style.display = "";
      el("next").onclick = nextQuestion;
      showQuestion();
    }

    shuffleQuestions();
    showQuestion();
  </script>
